name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Node Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Flutter packages
        run: flutter pub get
        working-directory: admin

      - name: Build Flutter Web App
        run: flutter build web --release --no-tree-shake-icons --base-href /admin/ --no-wasm-dry-run
        working-directory: admin

      - name: Combine Builds
        run: |
          mkdir -p dist/admin
          cp -r admin/build/web/* dist/admin/
        
      - name: Deploy to Firebase Hosting
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOT_LAB_21910 }}' > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json
          OUTPUT=$(npx --yes firebase-tools deploy --only hosting --project bot-lab-21910 --non-interactive 2>&1) && EXIT_CODE=0 || EXIT_CODE=$?
          rm -f gcp-key.json
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "is the current active version"; then
              echo "✅ Version already active on Firebase Hosting – no changes to deploy."
              exit 0
            fi
            exit $EXIT_CODE
          fi
